# Піднімає лише relay. signal-cli тут не запускається — він працює на окремому
# (вилученому) сервері, тож relay звертається до нього напряму по мережі, без
# спільної docker-мережі з xBot.
#
# Запуск: RELAY_API_KEY=... SIGNAL_BASE_URL=http://<host>:<port> docker compose up -d --build
# (або покласти RELAY_API_KEY і SIGNAL_BASE_URL у .env поряд із цим файлом)

volumes:
  relay-data:

services:
  xsignalrelay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xsignalrelay
    environment:
      - Signal__BaseUrl=${SIGNAL_BASE_URL:?Задайте SIGNAL_BASE_URL (адреса вилученого signal-cli)}
      - ApiKey=${RELAY_API_KEY:?Задайте RELAY_API_KEY (env або .env)}
      - Db__Path=/app/data/relay.db
    ports:
      - "8082:8080"
    volumes:
      - relay-data:/app/data
    restart: unless-stopped
